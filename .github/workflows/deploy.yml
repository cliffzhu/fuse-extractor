name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format -- --check

  deploy:
    runs-on: ubuntu-latest
    needs: [test, format-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate wrangler.toml from secrets
        run: |
          cat > wrangler.toml << 'EOF'
          name = "${{ secrets.WORKER_NAME || 'fuse-extractor' }}"
          type = "service"
          main = "src/index.ts"
          compatibility_date = "2024-09-23"
          
          [env.production]
          routes = [
            { pattern = "${{ secrets.WORKER_ROUTE || '*.fuse-extractor.dev' }}", zone_name = "${{ secrets.ZONE_NAME || 'fuse-extractor.dev' }}" }
          ]
          
          [env.development]
          routes = []
          
          observability = { enabled = true }
          limits = { cpu_milliseconds = 50 }
          EOF

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
